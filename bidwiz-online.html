<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BidWiz Online (beta)</title>
<style>
  :root{ --gold:#c9a227; --bg:#123524; --panel:#1a4530; --line:#2c5e41; --txt:#f4efe4; --dim:#9db8a8; --red:#b23; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--bg); color:var(--txt); font-family:Georgia,serif; min-height:100vh; padding:14px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; max-width:820px; margin:0 auto; }
  h1{ color:var(--gold); letter-spacing:1px; } h3{ color:var(--gold); margin:14px 0 8px; }
  .gold{ color:var(--gold); } .dim{ color:var(--dim); } .sm{ font-size:13px; } .big{ font-size:19px; }
  .btn{ background:#204a34; color:var(--txt); border:1px solid var(--gold); border-radius:9px; padding:9px 16px; font-family:inherit; font-size:15px; cursor:pointer; margin:4px; }
  .btn.gold{ background:var(--gold); color:#1c1305; font-weight:bold; }
  .btn.danger{ border-color:#a33; color:#f88; background:#3a1f1f; }
  .btn:disabled{ opacity:.4; cursor:default; }
  input,select{ background:#0f2b1d; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:15px; }
  .modecard{ border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:6px 0; cursor:pointer; }
  .modecard.sel{ border-color:var(--gold); background:#234d36; }
  .scorebar{ display:flex; justify-content:space-between; background:#0f2b1d; border:1px solid var(--line); border-radius:9px; padding:8px 14px; margin-bottom:12px; font-size:15px; }
  .seats{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .seat{ border:1px solid var(--line); border-radius:9px; padding:6px 12px; font-size:14px; }
  .seat.me{ border-color:var(--gold); }
  .seat .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#666; margin-right:5px; }
  .seat .dot.on{ background:#5c5; }
  .seat .dot.bot{ background:var(--gold); }
  .hand{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; min-height:70px; }
  .card{ width:52px; height:74px; background:#fdf8ec; color:#111; border-radius:8px; border:1px solid #999; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:20px; font-weight:bold; cursor:pointer; user-select:none; }
  .card .s{ font-size:24px; }
  .card.red{ color:#b11; }
  .card.legal:hover{ outline:3px solid var(--gold); }
  .card.dim{ opacity:.45; cursor:default; }
  .trickzone{ display:flex; gap:14px; justify-content:center; margin:14px 0; min-height:100px; align-items:center; }
  .tslot{ text-align:center; font-size:13px; }
  .tslot .card{ width:46px; height:66px; font-size:17px; cursor:default; }
  .turn-tag{ background:var(--gold); color:#1c1305; border-radius:7px; padding:2px 10px; font-weight:bold; font-size:14px; }
  .log{ font-size:12.5px; color:var(--dim); background:#0f2b1d; border-radius:9px; padding:8px 12px; margin-top:12px; }
  .toggle{ font-size:14px; }
  .center{ text-align:center; }
  .bidsheet{ font-size:14px; margin:6px 0; color:var(--dim); }
  .summary{ text-align:center; }
  .summary table{ margin:10px auto; border-collapse:collapse; }
  .summary td{ padding:5px 16px; border-bottom:1px solid var(--line); }
  .red-suit{ color:#b11; }
  .banner{ background:#0f2b1d; border:1px solid var(--gold); border-radius:9px; padding:9px 14px; margin:10px 0; text-align:center; }
  .layout{ display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .panel.slim{ padding:12px; }
  .col.left{ flex:0 0 240px; order:1; } .col.main{ flex:1 1 430px; order:2; min-width:300px; } .col.side{ flex:0 0 270px; order:3; }
  @media(max-width:899px){ .col.left{ order:3; } }
  .scoretable{ width:100%; border-collapse:collapse; font-size:14px; }
  .scoretable th{ color:var(--gold); border-bottom:1px solid var(--line); padding:5px 4px; font-size:12.5px; text-align:center; }
  .scoretable td{ border-bottom:1px solid var(--line); padding:4px 4px; text-align:center; font-size:15px; }
  .diag{ width:56px; height:36px; position:relative; margin:0 auto;
    background:linear-gradient(to bottom right, transparent 48.6%, var(--line) 48.6%, var(--line) 51.4%, transparent 51.4%); }
  .diag .bl{ position:absolute; top:0; left:3px; font-weight:bold; }
  .diag .br{ position:absolute; bottom:0; right:3px; font-weight:bold; color:var(--gold); }
  .trickzone{ min-height:190px; gap:20px; }
  .tslot .card{ width:68px; height:96px; font-size:26px; cursor:default; }
  .tslot .card .s{ font-size:30px; }
  .table{ position:relative; width:min(90vw,470px); aspect-ratio:1/1; margin:10px auto; background:#0f2b1d; border:2px solid var(--line); border-radius:18px; }
  .tablewrap{ position:relative; width:min(90vw,470px); margin:14px auto; padding:44px 74px; }
  .tablewrap .table{ width:100%; margin:0; }
  .pile{ position:absolute; text-align:center; }
  .pile.bottom{ bottom:0; left:50%; transform:translateX(-50%); }
  .pile.top{ top:0; left:50%; transform:translateX(-50%); }
  .pile.left{ left:0; top:50%; transform:translateY(-50%); }
  .pile.right{ right:0; top:50%; transform:translateY(-50%); }
  .pile.br{ right:8px; bottom:8px; }
  .pile.tl{ left:8px; top:8px; }
  .pile.tap{ cursor:pointer; }
  .pile.tap:hover .minicard{ border-color:#ffd76a; }
  .pilebox{ position:relative; margin:0 auto; }
  .minicard{ position:absolute; width:22px; height:32px; background:#1a4530; border:1.5px solid var(--gold); border-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.45); }
  .pslot{ position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; max-width:44%; }
  .pslot.bottom{ bottom:10px; left:50%; transform:translateX(-50%); }
  .pslot.top{ top:10px; left:50%; transform:translateX(-50%); }
  .pslot.left{ left:10px; top:50%; transform:translateY(-50%); }
  .pslot.right{ right:10px; top:50%; transform:translateY(-50%); }
  .plabel{ font-size:12.5px; color:var(--txt); white-space:nowrap; }
  .card.empty{ background:transparent; border:1px dashed var(--line); width:56px; height:80px; }
  .tablecenter{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; font-size:15px; pointer-events:none; }
  .peekrow{ margin:6px 0; }
  .peekcards{ display:flex; gap:6px; flex-wrap:wrap; }
  .bidchip{ display:inline-block; background:#234d36; border:1px solid var(--gold); border-radius:12px; padding:3px 10px; font-size:13.5px; font-weight:bold; }
  .bidchip.dim{ background:transparent; border-color:var(--line); color:var(--dim); font-weight:normal; }
  .dealer-tag{ display:inline-block; background:var(--gold); color:#1c1305; border-radius:7px; padding:1px 7px; font-size:10.5px; font-weight:bold; letter-spacing:1px; }
</style>
</head>
<body>
<div id="app"><div class="panel"><h1 class="center">🂡 BidWiz</h1><p class="dim center" style="margin-top:10px">Loading… If this message stays visible, something is blocked — tell BabyBot what you see.</p></div></div>
<div id="toast" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#3a1f1f;border:1px solid #a33;color:#f88;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90vw"></div>
<script>
window.onerror = function(msg){
  try {
    const app = document.getElementById('app');
    // keep the game visible; show the problem as a slim banner at the top
    const panel = document.querySelector('.panel');
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.style.borderColor = '#a33';
    banner.innerHTML = '<b>⚠️ Problem:</b> ' + String(msg) + ' <span class="sm dim">(screenshot this and send it to BabyBot)</span>';
    if (panel) panel.prepend(banner);
    else app.innerHTML = '<div class="panel"><h1>⚠️ Startup problem</h1><p class="sm" style="margin-top:8px;word-break:break-all">' + String(msg) + '</p><p class="sm dim" style="margin-top:8px">Screenshot this and send it to BabyBot.</p></div>';
  } catch(e) {}
};
</script>
<script>
let V = null;          // last server view
let peekOpen = false;  // last-tricks review panel
const VERSION = 'v16'; // bump on every reupload — shown on screen
// storage that survives private mode / in-app browsers (falls back to memory)
const store = (() => {
  try { const t = '__bw_t'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return localStorage; }
  catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, clear: () => { for (const k in m) delete m[k]; } }; }
})();
let TOK = store.getItem('bw_token') || '';
let CODE = store.getItem('bw_code') || '';
const $ = id => document.getElementById(id);
const SUITC = { H:'♥', S:'♠', D:'♦', C:'♣' };
const REDS = new Set(['H','D']);
const RANK = { 11:'J', 12:'Q', 13:'K', 14:'A' };
const rchar = r => RANK[r] || String(r);
function cardHTML(c, legalSet, cb){
  const legal = !legalSet || legalSet.has(c.s+c.r);
  return `<div class="card ${legal?'legal':'dim'}" ${cb?`onclick="${cb}('${c.s}',${c.r})"`:''}>
    <span>${rchar(c.r)}</span><span class="s ${REDS.has(c.s)?'red-suit':''}">${SUITC[c.s]}</span></div>`;
}
function esc(s){ return String(s).replace(/[<>&]/g,''); }

async function api(path, body){
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  return r.json();
}

// ---------- lobby ----------
function lobbyHTML(){
  return `<div class="panel">
    <h1 class="center">🂡 BidWiz <span class="gold">Online</span> <span class="sm dim">(beta)</span></h1>
    <h3>Create a table</h3>
    <input id="hname" placeholder="Your name" style="width:180px">
    <select id="hmode">
      <option value="partners">2 v 2 — Partners (4 seats)</option>
      <option value="heads">1 v 1 — Heads up (2 seats)</option>
      <option value="cut">1 v 1 v 1 v 1 — Cutthroat</option>
    </select>
    <label class="toggle"><input type="checkbox" id="hpush"> allow "and a push"</label>
    <button class="btn gold" onclick="createTable()">Create</button>
    <h3>Join a table</h3>
    <input id="jname" placeholder="Your name" style="width:180px">
    <input id="jcode" placeholder="Room code (e.g. K7QF)" style="width:150px; text-transform:uppercase">
    <button class="btn gold" onclick="joinTable()">Join</button>
    <p class="sm dim" style="margin-top:14px">Empty seats are played by robot AI until a friend takes them.
    If you leave, your seat keeps playing as a robot until you come back.</p>
    <p class="sm dim center" style="margin-top:8px">BidWiz ${VERSION}</p>
  </div>`;
}

async function createTable(){
  const name = $('hname').value.trim() || 'Host';
  const mode = $('hmode').value, push = $('hpush').checked;
  const r = await api('/api/create', { name, mode, push });
  TOK = r.token; CODE = r.code;
  store.setItem('bw_token', TOK); store.setItem('bw_code', CODE);
  listen();
}
async function joinTable(){
  const name = $('jname').value.trim() || 'Player';
  const code = $('jcode').value.trim().toUpperCase();
  const r = await api('/api/join', { name, code });
  if (r.error) { alert(r.error); return; }
  TOK = r.token; CODE = r.code;
  store.setItem('bw_token', TOK); store.setItem('bw_code', CODE);
  listen();
}

// ---------- live updates ----------
let es = null;
function listen(){
  if (es) es.close();
  es = new EventSource('/api/stream?token=' + TOK);
  es.onmessage = e => { V = JSON.parse(e.data); render(); };
  es.onerror = () => { setTimeout(()=>{ if(TOK) listen(); }, 1500); };
}

function act(type, extra){ api('/api/action', { token: TOK, type, ...extra }).then(r => { if (r && r.error) toast('⚠ ' + r.error + ' — the table moved on; check whose turn it is'); }).catch(()=>{}); }
function toast(msg){
  const t = $('toast'); if (!t) return;
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 3000);
}
// card taps call play(suit, rank) — sends your move to the server
async function play(suit, rank){ await act('play', { suit, rank }); }
function togglePeek(){ peekOpen = !peekOpen; render(); }

// ---------- render ----------
function render(){
  const app = $('app');
  if (!V || V.phase === 'lobby') {
    // host of a not-yet-started table → waiting room with the Start button
    app.innerHTML = (V && V.host) ? waitingHTML() : lobbyHTML();
    return;
  }
  app.innerHTML = tableHTML();
}

function waitingHTML(){
  const seats = V.names.map((n,i) => {
    const dot = V.robots[i] ? 'bot' : (V.connected[i] ? 'on' : 'off');
    return `<div class="seat"><span class="dot ${dot}"></span>${esc(n)}${V.robots[i]?' <span class="sm dim">(robot)</span>':''}</div>`;
  }).join('');
  return `<div class="panel">
    <h1 class="center">🂡 Table <span class="gold">${esc(V.code)}</span></h1>
    <p class="dim center sm">Give this code to your friends: <b class="gold big">${esc(V.code)}</b> — at ${location.origin}</p>
    <div class="seats" style="justify-content:center">${seats}</div>
    <p class="sm dim center">Empty seats play as robots. Friends can join until you start.</p>
    <p class="center"><button class="btn gold big" onclick="startGame()">Start game →</button></p>
    <p class="center"><button class="btn" onclick="store.clear();location.reload()">Leave table</button></p>
  </div>`;
}

async function startGame(){
  await api('/api/start', { token: TOK });
}

function seatRow(){
  return `<div class="seats">` + V.names.map((n,i) => {
    const dot = V.robots[i] ? 'bot' : (V.connected[i] ? 'on' : 'off');
    const isTurn = (V.phase==='play' && V.turn===i) || (V.phase==='bidding' && isBidder(i));
    return `<div class="seat ${i===V.yourSeat?'me':''}"><span class="dot ${dot}"></span>${esc(n)}${isTurn?' <span class="turn-tag">turn</span>':''}</div>`;
  }).join('') + `</div>`;
}
function isBidder(i){ return V.bids && V.bidOrder ? false : false; }

function scorebar(){
  if (V.mode === 'partners'){
    const a = V.scores[0] + '&' + V.scores[2], b = V.scores[1] + '&' + V.scores[3];
    return `Team A (You+P2+P4 side) <b>${V.scores[0]}&${V.scores[2]}</b> · Team B <b>${V.scores[1]}&${V.scores[3]}</b> · first to ${V.target}`;
  }
  return V.names.map((n,i)=>`${esc(n)} <b>${V.scores[i]}</b>`).join(' · ') + ` · first to ${V.target}`;
}

function trumpTxt(){ return V.trump==='NT' ? 'No Trump' : `<span class="${REDS.has(V.trump)?'red-suit':''}">${SUITC[V.trump]}</span>`; }

function tableHTML(){
  if (V.phase === 'over') return overHTML();
  const showClock = ['bidding','blind','throwchoice','play','trickwon'].includes(V.phase);
  const board = `<div class="scorebar"><span>Room <b class="gold">${V.code}</b> · Hand <b>${V.handNum}</b> · Trump ${trumpTxt()} · ${V.mode}</span><span>${scorebar()}</span></div>
    ${showClock ? clockTable() : seatRow()}` + phaseArea();
  if (V.mode === 'partners') {
    return `<div class="layout">
      <div class="col left"><div class="panel slim"><h3>Hand log</h3>${logHTML()}<p class="sm dim center" style="margin-top:6px">BidWiz ${VERSION}</p></div></div>
      <div class="col main"><div class="panel">${board}</div></div>
      <div class="col side"><div class="panel slim"><h3>Scoreboard</h3>${scoreTableHTML()}</div></div>
    </div>`;
  }
  return `<div class="panel">${board}<div class="log">${(V.log||[]).map(l=>esc(l)).join('<br>')}</div></div>`;
}

function phaseArea(){
  if (V.phase === 'bidding') return bidArea() + handRow();
  if (V.phase === 'blind') return blindArea() + handRow();
  if (V.phase === 'throwchoice') return throwArea() + handRow();
  if (V.phase === 'play' || V.phase === 'trickwon') return playArea();
  if (V.phase === 'summary') return summaryArea();
  return '';
}

function logHTML(){
  return `<div class="log" style="max-height:480px;overflow:auto">${(V.log||[]).map(l=>esc(l)).join('<br>')}</div>`;
}

// right-column scoreboard: one row per hand — trump, our points, diagonal bids, their points
function scoreTableHTML(){
  const us = V.yourSeat % 2, them = 1 - us;   // partners: Team A = seats 0,2 → team 0
  const sym = t => t === 'NT' ? 'NT' : `<span class="${REDS.has(t)?'red-suit':''}">${SUITC[t]||''}</span>`;
  const bidTxt = (n, isBlind) => (n === null || n === undefined) ? '' : (isBlind ? 'B' + n : String(n));
  const rows = (V.history || []).map(h => ({ t: h.trump, b: h.bids, bl: h.blind || [false,false,false,false], p: h.pts }));
  if (V.cur && V.phase !== 'summary') rows.push({ t: V.cur.trump, b: V.cur.bids, bl: V.cur.blind, p: null });
  const body = rows.map(r =>
    `<tr><td>${sym(r.t)}</td><td>${r.p ? r.p[us] : '—'}</td>
     <td><div class="diag"><span class="bl">${bidTxt(r.b[us], r.bl[us])}</span><span class="br">${bidTxt(r.b[them], r.bl[them])}</span></div></td>
     <td>${r.p ? r.p[them] : '—'}</td></tr>`).join('');
  return `<table class="scoretable">
    <tr><th>Trump</th><th>Us</th><th>Bids</th><th>Them</th></tr>${body || '<tr><td colspan="4" class="dim">—</td></tr>'}</table>
    <p class="sm dim center">B = blind bid · Us = you + partner</p>`;
}

// your cards, face up, no clicking (used in bidding/blind/throw phases)
function handRow(){
  return `<h3>Your cards</h3><div class="hand">${(V.yourHand||[]).map(c => cardHTML(c, null, null)).join('')}</div>`;
}

function bidArea(){
  const mine = V.bidOptions; // server only sends bidOptions to the seat whose turn it is
  let inner;
  if (mine){
    const opts = [];
    for (let n = mine.min; n <= mine.max; n++) opts.push(`<button class="btn" onclick="act('bid',{num:${n}})">${n}</button>`);
    inner = `<div class="banner"><b>Your bid.</b> ${mine.capNote||''}</div><div>${opts.join('')}</div>
      ${V.pushEligible ? `<button class="btn" onclick="act('bid',{num:${mine.min},push:true})">${mine.min} and a push</button>` : ''}
      ${V.formeEligible ? `<button class="btn" onclick="act('bid',{forme:true})">Bid for me</button>` : ''}`;
  } else {
    const done = (V.bids||[]).map((b,idx)=> b ? `${esc(V.names[idx])}: ${b.forme?'bid for me':b.num+(b.push?' +push':'')}` : null).filter(Boolean);
    const turnName = esc((V.names||[])[V.bidTurn] || 'another player');
    inner = `<div class="banner dim">⏳ Waiting for <b>${turnName}</b> to bid… ${done.length? 'So far: '+done.join(' · ') : ''}</div>`;
  }
  return `<h3>Bidding</h3>${inner}`;
}

function blindArea(){
  const sd = (V.blindQueue||[])[0];
  const sideSeats = V.mode==='partners' ? (sd===0?[0,2]:[1,3]) : [sd];
  const mine = sideSeats.includes(V.yourSeat);
  const whoTxt = V.mode==='partners' ? (sd===0?'Team A':'Team B') : (V.names[sd]||('seat '+(sd+1)));
  return `<div class="banner"><b>Blind offer</b> — ${esc(whoTxt)} is 100+ points behind.</div>
    ${mine ? `<div class="center"><button class="btn gold" onclick="act('blind',{num:7})">Blind 7</button>
      <button class="btn" onclick="act('blind',{num:10})">Blind 10</button>
      <button class="btn" onclick="act('blind',{num:0})">Skip</button></div>`
      : `<div class="banner dim">Waiting for the blind decision…</div>`}`;
}

function throwArea(){
  const mine = V.pendingChoice && V.pendingChoice.who === (V.mode==='partners' ? V.yourSeat%2 : V.yourSeat);
  return `<div class="banner"><b>⚠️ Combined bids ${V.pendingChoice.combined} ≤ 10 — throw-in decision</b> <span class="sm">(this is not bidding — choose below)</span></div>
    ${mine ? `<div class="center"><button class="btn gold big" onclick="act('throw',{choice:'in'})">Throw in — take the points</button>
      <button class="btn big" onclick="act('throw',{choice:'out'})">Play it out</button></div>`
      : `<div class="banner dim">⏳ Waiting for the bigger-bid side (${esc((V.names||[]).find((n,i)=>(V.mode==='partners'? i%2 : i)===V.pendingChoice.who)||'other team')}) to decide…</div>`}`;
}

// clock-face table: you at 6 o'clock, partner 12, opponents 9 and 3.
// During play: each played card appears in front of its player.
// During bidding/blind/throw: each player's bid appears at their seat instead.
function clockTable(){
  const me = V.yourSeat, n = (V.names||[]).length;
  const pos = {};
  if (n === 4) { pos[(me+1)%4] = 'left'; pos[(me+2)%4] = 'top'; pos[(me+3)%4] = 'right'; pos[me] = 'bottom'; }
  else if (n === 2) { pos[me] = 'bottom'; pos[(me+1)%2] = 'top'; }
  else { for (let i=0;i<n;i++) pos[i] = 'top'; pos[me] = 'bottom'; }
  const nameOf = i => esc((V.names||[])[i] || 'Player ' + ((i||0)+1));
  const played = {}; (V.trick||[]).forEach(p => played[p.seat] = p.card);
  const biddingLike = V.phase==='bidding' || V.phase==='blind' || V.phase==='throwchoice';
  const winner = (V.lastWin !== null && V.lastWin !== undefined) ? V.lastWin : -1;
  const bidChip = i => {
    const b = (V.bids||[])[i];
    if (V.blind && (V.mode==='partners' ? i%2 : i) === V.blind.side) return '<span class="bidchip">🂠 Blind ' + V.blind.num + '</span>';
    if (b) return b.forme ? '<span class="bidchip">🤐 bid for me</span>'
      : '<span class="bidchip">bid ' + b.num + (b.push ? ' +push' : '') + '</span>';
    return '<span class="bidchip dim">· waiting</span>';
  };
  const slot = i => {
    const dot = V.robots[i] ? 'bot' : (V.connected[i] ? 'on' : 'off');
    const activeTurn = (V.phase==='play' || V.phase==='trickwon') ? V.turn===i : (V.phase==='bidding' && V.bidTurn===i);
    const card = played[i];
    const tricks = (V.tricksWon||{})[String(V.mode==='partners' ? i%2 : i)] || 0;
    return `<div class="pslot ${pos[i]}">
      <div class="plabel">${activeTurn?'<span class="turn-tag">●</span> ':''}<span class="dot ${dot}"></span>${nameOf(i)}${V.mode==='partners'?` <span class="sm">· ${tricks}</span>`:''}${i===V.dealer?' <span class="dealer-tag">DEALER</span>':''}</div>
      ${biddingLike ? bidChip(i) : (card ? cardHTML(card, null, null) : '<div class="card empty"></div>')}
    </div>`;
  };
  const dealerName = nameOf(V.dealer);
  const center = biddingLike
    ? `<div class="tablecenter dim sm">Bidding</div>`
    : (V.phase==='trickwon' && winner>=0
      ? `<div class="tablecenter gold">🏆 ${nameOf(winner)} took trick ${V.trickNum}</div>`
      : '');
  // trick piles: face-down mini-cards, one per won trick, building stairs outside the table
  const piles = (V.phase==='play' || V.phase==='trickwon') ? pilesHTML() : '';
  return `<div class="tablewrap"><div class="table">${Object.keys(pos).map(i=>slot(+i)).join('')}${center}</div>${piles}</div>`;
}

// stair-building pile of face-down mini-cards (one per trick taken).
// Tap a pile (while no card is in play) to reveal the last tricks — anonymous.
function pileHTML(count, cls, label){
  if (!count) return '';
  const shown = Math.min(count, 8);
  let cards = '';
  for (let k = 0; k < shown; k++) cards += `<div class="minicard" style="left:${k*10}px;bottom:${k*13}px"></div>`;
  const clickable = cls.includes('tap');
  return `<div class="pile ${cls}" ${clickable?`onclick="togglePeek()" title="Show last tricks"`:''}><div class="pilebox" style="width:${10*shown+22}px;height:${13*shown+32}px">${cards}</div><div class="sm dim">${label}</div></div>`;
}

function pilesHTML(){
  const tw = V.tricksWon || {};
  const c = k => tw[String(k)] || 0;
  const canReveal = (V.trick||[]).length === 0;   // reveal available until a card is played
  const tap = canReveal ? ' tap' : '';
  if (V.mode === 'partners') {
    const us = V.yourSeat % 2, them = 1 - us;
    return pileHTML(c(us), 'br'+tap, 'Us') + pileHTML(c(them), 'tl'+tap, 'Them');
  }
  if (V.mode === 'heads') return pileHTML(c(V.yourSeat), 'br'+tap, 'You') + pileHTML(c((V.yourSeat+1)%2), 'tl'+tap, 'Opp');
  // cutthroat: each player's pile beside their own seat
  const me = V.yourSeat, n = (V.names||[]).length;
  const map = n === 4 ? { [me]:'bottom', [(me+1)%4]:'left', [(me+2)%4]:'top', [(me+3)%4]:'right' } : { [me]:'bottom' };
  return Object.keys(map).map(i => pileHTML(c(+i), map[i]+tap, nameOf(+i))).join('');
}

function playArea(){
  const legalSet = new Set((V.legal||[]).map(c=>c.s+c.r));
  const myTurn = V.phase==='play' && V.turn===V.yourSeat;
  const nameOf = i => esc((V.names||[])[i] || 'Player ' + ((i||0)+1));
  let msg;
  if (V.phase === 'trickwon' && V.lastWin >= 0) {
    msg = `<div class="banner"><b>🏆 ${nameOf(V.lastWin)} took trick ${V.trickNum}.</b> <span class="sm dim">5s review pause — peek at last tricks below.</span></div>`;
  } else if (myTurn) {
    msg = `<div class="banner"><b>Your turn</b> — play a highlighted card.</div>`;
  } else {
    msg = `<div class="banner dim">Waiting… <b>${nameOf(V.turn)}</b> to play.</div>`;
  }
  const canReveal = (V.trick||[]).length === 0;   // reveal available until a card is played
  if (peekOpen && !canReveal) peekOpen = false;   // auto-close once a card hits the table
  const peek = (peekOpen && canReveal) ? `<div class="panel slim" style="margin-bottom:10px"><h3>Last 2 tricks <span class="sm dim">(anonymous — cards only, tap a pile to close)</span></h3>${peekHTML()}</div>` : '';
  return `${peek}${msg}
    <div class="hand">${(V.yourHand||[]).map(c => cardHTML(c, legalSet, myTurn?'play':'' )).join('')}</div>`;
}

function peekHTML(){
  const rows = (V.lastTricks || []).slice(-2).reverse();   // newest trick first
  if (!rows.length) return '<div class="banner dim">No completed tricks yet.</div>';
  return rows.map(r =>
    `<div class="peekrow"><div class="sm dim">Trick ${r.n}</div><div class="peekcards">${(r.cards||[]).map(c => cardHTML(c, null, null)).join('')}</div></div>`).join('');
}

function summaryArea(){
  const rows = (V.summaryRows||[]).map(r =>
    `<tr><td>${esc(r.name)}</td><td>bid ${r.bid}</td><td>took ${r.tricks??'—'}</td><td class="gold">${r.pts>=0?'+':''}${r.pts}</td></tr>`).join('');
  return `<div class="summary"><h3>${V.summaryThrown?'Throw-in!':'Hand '+V.handNum+' complete'}</h3>
    <table>${rows}</table>
    <button class="btn gold big" onclick="act('next')">Next hand →</button></div>`;
}

function overHTML(){
  return `<div class="panel center">
    <h1>🏆 ${esc(V.winner.name)}</h1>
    <p class="big">Final: ${V.names.map((n,i)=>esc(n)+' '+V.scores[i]).join(' · ')}</p>
    ${V.host ? `<button class="btn gold big" onclick="act('again')">Play again</button>` : `<p class="dim">Host can start a rematch.</p>`}
    <p><button class="btn" onclick="store.clear();location.reload()">Leave table</button></p>
  </div>`;
}

window.act = act; window.createTable = createTable; window.joinTable = joinTable; window.startGame = startGame; window.play = play; window.togglePeek = togglePeek;

if (TOK && CODE) {
  // try to resume an existing session
  fetch('/api/state?token=' + TOK).then(r => {
    if (r.ok) { listen(); } else { store.clear(); render(); }
  }).catch(() => render());
} else render();
</script>
</body>
</html>
