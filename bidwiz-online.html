<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BidWiz Online (beta)</title>
<style>
  :root{ --gold:#c9a227; --bg:#123524; --panel:#1a4530; --line:#2c5e41; --txt:#f4efe4; --dim:#9db8a8; --red:#b23; }
  *{ box-sizing:border-box; margin:0; }
  body{ background:var(--bg); color:var(--txt); font-family:Georgia,serif; min-height:100vh; padding:14px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; max-width:820px; margin:0 auto; }
  h1{ color:var(--gold); letter-spacing:1px; } h3{ color:var(--gold); margin:14px 0 8px; }
  .gold{ color:var(--gold); } .dim{ color:var(--dim); } .sm{ font-size:13px; } .big{ font-size:19px; }
  .btn{ background:#204a34; color:var(--txt); border:1px solid var(--gold); border-radius:9px; padding:9px 16px; font-family:inherit; font-size:15px; cursor:pointer; margin:4px; }
  .btn.gold{ background:var(--gold); color:#1c1305; font-weight:bold; }
  .btn.danger{ border-color:#a33; color:#f88; background:#3a1f1f; }
  .btn:disabled{ opacity:.4; cursor:default; }
  input,select{ background:#0f2b1d; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:15px; }
  .modecard{ border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:6px 0; cursor:pointer; }
  .modecard.sel{ border-color:var(--gold); background:#234d36; }
  .scorebar{ display:flex; justify-content:space-between; background:#0f2b1d; border:1px solid var(--line); border-radius:9px; padding:8px 14px; margin-bottom:12px; font-size:15px; }
  .seats{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .seat{ border:1px solid var(--line); border-radius:9px; padding:6px 12px; font-size:14px; }
  .seat.me{ border-color:var(--gold); }
  .seat .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#666; margin-right:5px; }
  .seat .dot.on{ background:#5c5; }
  .seat .dot.bot{ background:var(--gold); }
  .hand{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; min-height:70px; }
  .card{ width:52px; height:74px; background:#fdf8ec; color:#111; border-radius:8px; border:1px solid #999; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:20px; font-weight:bold; cursor:pointer; user-select:none; }
  .card .s{ font-size:24px; }
  .card.red{ color:#b11; }
  .card.legal:hover{ outline:3px solid var(--gold); }
  .card.dim{ opacity:.45; cursor:default; }
  .trickzone{ display:flex; gap:14px; justify-content:center; margin:14px 0; min-height:100px; align-items:center; }
  .tslot{ text-align:center; font-size:13px; }
  .tslot .card{ width:46px; height:66px; font-size:17px; cursor:default; }
  .turn-tag{ background:var(--gold); color:#1c1305; border-radius:7px; padding:2px 10px; font-weight:bold; font-size:14px; }
  .log{ font-size:12.5px; color:var(--dim); background:#0f2b1d; border-radius:9px; padding:8px 12px; margin-top:12px; }
  .toggle{ font-size:14px; }
  .center{ text-align:center; }
  .bidsheet{ font-size:14px; margin:6px 0; color:var(--dim); }
  .summary{ text-align:center; }
  .summary table{ margin:10px auto; border-collapse:collapse; }
  .summary td{ padding:5px 16px; border-bottom:1px solid var(--line); }
  .red-suit{ color:#b11; }
  .banner{ background:#0f2b1d; border:1px solid var(--gold); border-radius:9px; padding:9px 14px; margin:10px 0; text-align:center; }
</style>
</head>
<body>
<div id="app"><div class="panel"><h1 class="center">🂡 BidWiz</h1><p class="dim center" style="margin-top:10px">Loading… If this message stays visible, something is blocked — tell BabyBot what you see.</p></div></div>
<script>
window.onerror = function(msg){
  try {
    document.getElementById('app').innerHTML =
      '<div class="panel"><h1>⚠️ Startup problem</h1><p class="sm" style="margin-top:8px;word-break:break-all">' + String(msg) + '</p><p class="sm dim" style="margin-top:8px">Screenshot this and send it to BabyBot.</p></div>';
  } catch(e) {}
};
</script>
<script>
let V = null;          // last server view
// storage that survives private mode / in-app browsers (falls back to memory)
const store = (() => {
  try { const t = '__bw_t'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return localStorage; }
  catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, clear: () => { for (const k in m) delete m[k]; } }; }
})();
let TOK = store.getItem('bw_token') || '';
let CODE = store.getItem('bw_code') || '';
const $ = id => document.getElementById(id);
const SUITC = { H:'♥', S:'♠', D:'♦', C:'♣' };
const REDS = new Set(['H','D']);
const RANK = { 11:'J', 12:'Q', 13:'K', 14:'A' };
const rchar = r => RANK[r] || String(r);
function cardHTML(c, legalSet, cb){
  const legal = !legalSet || legalSet.has(c.s+c.r);
  return `<div class="card ${legal?'legal':'dim'}" ${cb?`onclick="${cb}('${c.s}',${c.r})"`:''}>
    <span>${rchar(c.r)}</span><span class="s ${REDS.has(c.s)?'red-suit':''}">${SUITC[c.s]}</span></div>`;
}
function esc(s){ return String(s).replace(/[<>&]/g,''); }

async function api(path, body){
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  return r.json();
}

// ---------- lobby ----------
function lobbyHTML(){
  return `<div class="panel">
    <h1 class="center">🂡 BidWiz <span class="gold">Online</span> <span class="sm dim">(beta)</span></h1>
    <h3>Create a table</h3>
    <input id="hname" placeholder="Your name" style="width:180px">
    <select id="hmode">
      <option value="partners">2 v 2 — Partners (4 seats)</option>
      <option value="heads">1 v 1 — Heads up (2 seats)</option>
      <option value="cut">1 v 1 v 1 v 1 — Cutthroat</option>
    </select>
    <label class="toggle"><input type="checkbox" id="hpush"> allow "and a push"</label>
    <button class="btn gold" onclick="createTable()">Create</button>
    <h3>Join a table</h3>
    <input id="jname" placeholder="Your name" style="width:180px">
    <input id="jcode" placeholder="Room code (e.g. K7QF)" style="width:150px; text-transform:uppercase">
    <button class="btn gold" onclick="joinTable()">Join</button>
    <p class="sm dim" style="margin-top:14px">Empty seats are played by robot AI until a friend takes them.
    If you leave, your seat keeps playing as a robot until you come back.</p>
  </div>`;
}

async function createTable(){
  const name = $('hname').value.trim() || 'Host';
  const mode = $('hmode').value, push = $('hpush').checked;
  const r = await api('/api/create', { name, mode, push });
  TOK = r.token; CODE = r.code;
  store.setItem('bw_token', TOK); store.setItem('bw_code', CODE);
  listen();
}
async function joinTable(){
  const name = $('jname').value.trim() || 'Player';
  const code = $('jcode').value.trim().toUpperCase();
  const r = await api('/api/join', { name, code });
  if (r.error) { alert(r.error); return; }
  TOK = r.token; CODE = r.code;
  store.setItem('bw_token', TOK); store.setItem('bw_code', CODE);
  listen();
}

// ---------- live updates ----------
let es = null;
function listen(){
  if (es) es.close();
  es = new EventSource('/api/stream?token=' + TOK);
  es.onmessage = e => { V = JSON.parse(e.data); render(); };
  es.onerror = () => { setTimeout(()=>{ if(TOK) listen(); }, 1500); };
}

function act(type, extra){ api('/api/action', { token: TOK, type, ...extra }); }

// ---------- render ----------
function render(){
  const app = $('app');
  if (!V || V.phase === 'lobby') { app.innerHTML = lobbyHTML(); return; }  // no game state yet → show the lobby
  app.innerHTML = tableHTML();
}

function seatRow(){
  return `<div class="seats">` + V.names.map((n,i) => {
    const dot = V.robots[i] ? 'bot' : (V.connected[i] ? 'on' : 'off');
    const isTurn = (V.phase==='play' && V.turn===i) || (V.phase==='bidding' && isBidder(i));
    return `<div class="seat ${i===V.yourSeat?'me':''}"><span class="dot ${dot}"></span>${esc(n)}${isTurn?' <span class="turn-tag">turn</span>':''}</div>`;
  }).join('') + `</div>`;
}
function isBidder(i){ return V.bids && V.bidOrder ? false : false; }

function scorebar(){
  if (V.mode === 'partners'){
    const a = V.scores[0] + '&' + V.scores[2], b = V.scores[1] + '&' + V.scores[3];
    return `Team A (You+P2+P4 side) <b>${V.scores[0]}&${V.scores[2]}</b> · Team B <b>${V.scores[1]}&${V.scores[3]}</b> · first to ${V.target}`;
  }
  return V.names.map((n,i)=>`${esc(n)} <b>${V.scores[i]}</b>`).join(' · ') + ` · first to ${V.target}`;
}

function trumpTxt(){ return V.trump==='NT' ? 'No Trump' : `<span class="${REDS.has(V.trump)?'red-suit':''}">${SUITC[V.trump]}</span>`; }

function tableHTML(){
  if (V.phase === 'over') return overHTML();
  let h = `<div class="panel">
    <div class="scorebar"><span>Room <b class="gold">${V.code}</b> · Hand <b>${V.handNum}</b> · Trump ${trumpTxt()} · ${V.mode}</span><span>${scorebar()}</span></div>
    ${seatRow()}`;
  if (V.phase === 'bidding') h += bidArea();
  else if (V.phase === 'blind') h += blindArea();
  else if (V.phase === 'throwchoice') h += throwArea();
  else if (V.phase === 'play' || V.phase === 'trickwon') h += playArea();
  else if (V.phase === 'summary') h += summaryArea();
  h += `<div class="log">${(V.log||[]).map(l=>esc(l)).join('<br>')}</div></div>`;
  return h;
}

function bidArea(){
  const mine = V.bidOptions; // server only sends bidOptions to the seat whose turn it is
  let inner;
  if (mine){
    const opts = [];
    for (let n = mine.min; n <= mine.max; n++) opts.push(`<button class="btn" onclick="act('bid',{num:${n}})">${n}</button>`);
    inner = `<div class="banner"><b>Your bid.</b> ${mine.capNote||''}</div><div>${opts.join('')}</div>
      ${V.pushEligible ? `<button class="btn" onclick="act('bid',{num:${mine.min},push:true})">${mine.min} and a push</button>` : ''}
      ${V.formeEligible ? `<button class="btn" onclick="act('bid',{forme:true})">Bid for me</button>` : ''}`;
  } else {
    const done = (V.bids||[]).map((b,idx)=> b ? `${esc(V.names[idx])}: ${b.forme?'bid for me':b.num+(b.push?' +push':'')}` : null).filter(Boolean);
    inner = `<div class="banner dim">Waiting for bids… ${done.length? 'So far: '+done.join(' · ') : ''}</div>`;
  }
  return `<h3>Bidding</h3>${inner}`;
}

function blindArea(){
  const sd = (V.blindQueue||[])[0];
  const sideSeats = V.mode==='partners' ? (sd===0?[0,2]:[1,3]) : [sd];
  const mine = sideSeats.includes(V.yourSeat);
  const whoTxt = V.mode==='partners' ? (sd===0?'Team A':'Team B') : (V.names[sd]||('seat '+(sd+1)));
  return `<div class="banner"><b>Blind offer</b> — ${esc(whoTxt)} is 100+ points behind.</div>
    ${mine ? `<div class="center"><button class="btn gold" onclick="act('blind',{num:7})">Blind 7 (+140/−70)</button>
      <button class="btn" onclick="act('blind',{num:10})">Blind 10 (+400/−100)</button>
      <button class="btn" onclick="act('blind',{num:0})">Skip</button></div>`
      : `<div class="banner dim">Waiting for the blind decision…</div>`}`;
}

function throwArea(){
  const mine = V.pendingChoice && V.pendingChoice.who === (V.mode==='partners' ? V.yourSeat%2 : V.yourSeat);
  return `<div class="banner"><b>Combined bids ${V.pendingChoice.combined} ≤ 10 — throw in?</b></div>
    ${mine ? `<div class="center"><button class="btn gold" onclick="act('throw',{choice:'in'})">Throw in — take the points</button>
      <button class="btn" onclick="act('throw',{choice:'out'})">Play it out</button></div>`
      : `<div class="banner dim">Waiting for the bigger-bid side to decide…</div>`}`;
}

function playArea(){
  const legalSet = new Set((V.legal||[]).map(c=>c.s+c.r));
  const myTurn = V.phase==='play' && V.turn===V.yourSeat;
  let trick = `<div class="trickzone">` + (V.trick||[]).map(p =>
      `<div class="tslot">${cardHTML(p.card, null, null)}<div>${esc(V.names[p.seat])}</div></div>`).join('') + `</div>`;
  let msg;
  if (myTurn) msg = `<div class="banner"><b>Your turn</b> — play a highlighted card.</div>`;
  else msg = `<div class="banner dim">Waiting… <b>${esc(V.names[V.turn]||'')}</b> to play.</div>`;
  return `<h3>${V.phase==='trickwon' ? 'Trick ' + V.trickNum + ' won' : 'Trick ' + ((V.trickNum||0)+1)}</h3>${trick}${msg}
    <div class="hand">${V.yourHand.map(c => cardHTML(c, legalSet, myTurn?'play':'' )).join('')}</div>`;
}

function summaryArea(){
  const rows = (V.summaryRows||[]).map(r =>
    `<tr><td>${esc(r.name)}</td><td>bid ${r.bid}</td><td>took ${r.tricks??'—'}</td><td class="gold">${r.pts>=0?'+':''}${r.pts}</td></tr>`).join('');
  return `<div class="summary"><h3>${V.summaryThrown?'Throw-in!':'Hand '+V.handNum+' complete'}</h3>
    <table>${rows}</table>
    <button class="btn gold big" onclick="act('next')">Next hand →</button></div>`;
}

function overHTML(){
  return `<div class="panel center">
    <h1>🏆 ${esc(V.winner.name)}</h1>
    <p class="big">Final: ${V.names.map((n,i)=>esc(n)+' '+V.scores[i]).join(' · ')}</p>
    ${V.host ? `<button class="btn gold big" onclick="act('again')">Play again</button>` : `<p class="dim">Host can start a rematch.</p>`}
    <p><button class="btn" onclick="store.clear();location.reload()">Leave table</button></p>
  </div>`;
}

window.act = act; window.createTable = createTable; window.joinTable = joinTable;

if (TOK && CODE) {
  // try to resume an existing session
  fetch('/api/state?token=' + TOK).then(r => {
    if (r.ok) { listen(); } else { store.clear(); render(); }
  }).catch(() => render());
} else render();
</script>
</body>
</html>
